plugins {
	id 'fabric-loom' version '1.5-SNAPSHOT'
	id 'maven-publish'
	id 'com.google.protobuf' version '0.9.4'
}

group = project.maven_group
version = project.mod_version

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom handles most repos
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "io.lindstrom:m3u8-parser:${project.m3u8_parser_version}"
	implementation "org.bytedeco:javacv:${project.javacv_version}"
	implementation "com.github.weisj:jsvg:${project.jsvg_parser}"

	// Protobuf
	implementation "com.google.protobuf:protobuf-java:3.25.3"

	include "io.lindstrom:m3u8-parser:${project.m3u8_parser_version}"
	include "com.github.weisj:jsvg:${project.jsvg_parser}"

	include "org.bytedeco:javacv:${project.javacv_version}"
	include "org.bytedeco:javacpp:${project.javacv_version}"
	include "org.bytedeco:ffmpeg:6.0-${project.javacv_version}"
	include "com.google.protobuf:protobuf-java:3.25.3"
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:3.25.3"
	}
	generateProtoTasks {
		all().each { task ->
			task.builtins {
				java {
					option "lite" // Use protobuf-lite for smaller JAR size
				}
			}
		}
	}
}

processResources {
	inputs.property "version", project.version
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	exclude "**/*.proto"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

sourceSets.main {
	proto {
		srcDir 'src/main/proto'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// -----------------------------------------------------------------------
// Native library build (Rust)
// -----------------------------------------------------------------------

// Detect OS for native library extension
def osName = System.getProperty("os.name", "").toLowerCase()
def nativeExt = osName.contains("win") ? ".dll" : (osName.contains("mac") ? ".dylib" : ".so")
def nativeLibName = "libwebstreamer_lav" + (osName.contains("win") ? ".dll" : nativeExt)

def nativeDir = file("native")
def nativeBuildDir = file("native/target/release")
def nativeOutputDir = file("src/main/resources/natives")

def ffmpegDir = System.getenv("FFMPEG_DIR") ?: "C:\\ffmpeg\\ffmpeg-6.1-dev\\ffmpeg-n6.1.3-win64-gpl-shared-6.1"

task buildNative(type: Exec) {
	description = 'Build the Rust native library with cargo'
	group = 'native'
	workingDir nativeDir
	commandLine 'cargo', 'build', '--release', '--lib'
	environment 'FFMPEG_DIR', ffmpegDir

	// Only run if native source files have changed
	inputs.dir nativeDir
	outputs.dir nativeBuildDir
}

// Copy the built native library into the resources directory
task copyNative(type: Copy, dependsOn: buildNative) {
	description = 'Copy the built native library to resources'
	group = 'native'
	from(nativeBuildDir) {
		include "webstreamer_lav${nativeExt}"
		include "libwebstreamer_lav${nativeExt}"
	}
	into nativeOutputDir
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Make the jar task depend on native build
jar.dependsOn copyNative
processResources.dependsOn copyNative
sourcesJar.dependsOn copyNative

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
