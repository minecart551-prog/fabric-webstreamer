pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith('fabric-loom')) {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
}

buildscript {
    configurations.all {
        resolutionStrategy {
            force 'com.google.code.gson:gson:2.10.1'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}
